[package]
name = "tzolkin"
version = "0.1.0"
edition = "2021"

[lib]
# `cdylib` as well as `rlib` so train/features.py can call the real encoder
# through ctypes instead of reimplementing it in numpy.
crate-type = ["rlib", "cdylib"]

[dependencies]
rand = { version = "0.8", default-features = false, features = ["std", "std_rng", "small_rng"] }
smallvec = { version = "1", features = ["union", "const_generics"] }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
# The transposition key is 320 bytes; SipHash costs 0.586 us on it against
# 0.406 with FxHash -- comparable to a whole state encode.
rustc-hash = "2"

[dev-dependencies]
proptest = "1"

[profile.release]
debug = true
